spring:
  application:
    name: bate-mcp-server
  ai:
    mcp:
      server:
        name: bate-mcp-server
        version: 0.1.0
        type: SYNC
        # Streamable HTTP — the modern MCP transport (SSE is deprecated as of the 2025-06-18 spec
        # revision). Reachable both by a real MCP client (Claude Desktop/Claude Code via
        # `claude mcp add --transport http`) and by bate-banking-core acting as an MCP client.
        protocol: STREAMABLE
        instructions: >
          Tools for Bate Banking's AI features: writing a severity assessment for a flagged
          anomaly, a customer-facing summary of a payment outcome, and an end-of-session debrief
          for a Game Mode trading session. Every tool is purely advisory — the caller has already
          made its real decision before calling any of these; the tool only writes the narration.

server:
  port: 8081

claude:
  api-key: ${CLAUDE_API_KEY:placeholder-set-me}
  api-url: https://api.anthropic.com
  model: claude-3-5-haiku-20241022
  timeout-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
