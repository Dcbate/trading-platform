# Standard nginx WebSocket-upgrade pattern: only swap the Connection header to "upgrade" when the
# client actually sent an Upgrade header (the /v1/orders/stream handshake); every plain HTTP
# request through /v1/ gets "close" so ordinary keep-alive/proxying behavior is unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    # SPA: any path that isn't a real static file falls back to index.html so React Router
    # handles client-side routes like /accounts directly (not just via in-app navigation).
    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }

    # Same-origin proxy to the backend — this is what lets the browser send the HTTP-only,
    # SameSite=Strict access_token/refresh_token cookies AuthController sets: SameSite=Strict
    # cookies are dropped on cross-origin requests, so the frontend and API have to look like one
    # origin from the browser's point of view. `app` is the backend's service name on the compose
    # network (see docker/docker-compose.yml).
    #
    # The Upgrade/Connection headers below are required for /v1/orders/stream (WebSocketConfig) —
    # without them nginx proxies the handshake as a plain HTTP request and the upgrade to WS never
    # happens. $connection_upgrade (defined above) keeps this a no-op for every other /v1/ request.
    location /v1/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
