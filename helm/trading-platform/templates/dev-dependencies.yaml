{{- if .Values.devDependencies.enabled }}
# Throwaway single-replica Postgres/Redis/Kafka for local dev/testing only (kind, minikube).
# values-staging.yaml/values-prod.yaml disable this and point externalDependencies at managed
# services instead — never run these in a real environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trading-platform.fullname" . }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "trading-platform.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "trading-platform.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: trading
            - name: POSTGRES_USER
              value: trading
            - name: POSTGRES_PASSWORD
              value: trading
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "trading"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trading-platform.fullname" . }}-postgres
spec:
  selector:
    app: {{ include "trading-platform.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trading-platform.fullname" . }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "trading-platform.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "trading-platform.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trading-platform.fullname" . }}-redis
spec:
  selector:
    app: {{ include "trading-platform.fullname" . }}-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trading-platform.fullname" . }}-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "trading-platform.fullname" . }}-kafka
  template:
    metadata:
      labels:
        app: {{ include "trading-platform.fullname" . }}-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ include "trading-platform.fullname" . }}-kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          ports:
            - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trading-platform.fullname" . }}-kafka
spec:
  selector:
    app: {{ include "trading-platform.fullname" . }}-kafka
  ports:
    - port: 9092
      targetPort: 9092
{{- end }}
