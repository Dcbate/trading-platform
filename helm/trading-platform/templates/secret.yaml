apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trading-platform.fullname" . }}-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.secrets.datasourceUsername | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.datasourcePassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  CLAUDE_API_KEY: {{ .Values.secrets.claudeApiKey | quote }}
  SENDGRID_API_KEY: {{ .Values.secrets.sendgridApiKey | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
