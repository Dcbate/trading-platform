# helm install trading-platform ./helm/trading-platform -f values-dev.yaml
# Fixed release name "trading-platform" assumed — the dev dependency hostnames below are derived
# from it (see templates/dev-dependencies.yaml).
replicaCount: 1

autoscaling:
  enabled: false

devDependencies:
  enabled: true

externalDependencies:
  datasourceUrl: "jdbc:postgresql://trading-platform-postgres:5432/trading"
  redisHost: "trading-platform-redis"
  kafkaBootstrapServers: "trading-platform-kafka:9092"

secrets:
  datasourceUsername: "trading"
  datasourcePassword: "trading"
  jwtSecret: "local-dev-secret-change-me-please-32bytes"

env:
  springProfiles: "k8s,dev"

ingress:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
