apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-platform
  namespace: trading-platform
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - host: api.trading.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-platform
                port:
                  number: 80
