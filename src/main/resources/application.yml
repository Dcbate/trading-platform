spring:
  application:
    name: trading-platform

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/trading
    username: trading
    password: trading
    hikari:
      maximum-pool-size: 20
      pool-name: trading-hikari

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: batch

jwt:
  # Local HS256 secret for Phase 1. Production would source this from GCP Secret Manager
  # and likely front an OAuth2 IdP instead of a shared symmetric secret.
  secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes}
  issuer: trading-platform

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # "always" so the custom order-book-depth indicator is actually visible. A production
      # deployment behind a real IdP would tighten this to "when-authorized" with an ops role.
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /v1/swagger-ui.html
  api-docs:
    path: /v1/api-docs

gemini:
  api-key: ${GEMINI_API_KEY:placeholder-set-me}
  api-url: https://generativelanguage.googleapis.com
  model: gemini-2.0-flash
  timeout-ms: 2000

chronicle:
  trade-journal:
    path: ${CHRONICLE_PATH:./chronicle-data/trades}

trading:
  symbols: AAPL,GOOG,TSLA,MSFT,AMZN
  price-feed:
    tick-interval-ms: 2000
    anomaly-threshold-percent: 10
  matching-engine:
    batch-size: 1000
    poll-timeout-ms: 100
    thread-affinity:
      enabled: false
      core: 0
  risk:
    max-notional-per-client: 1000000
    max-orders-per-window: 5
    window-seconds: 60

payment:
  fraud:
    amount-multiplier-threshold: 3
    max-payments-per-window: 5
    window-seconds: 60
    country-change-window-hours: 2
  settlement:
    # Stand-in for a real bank gateway (none exists for Phase 2): amounts above this
    # deterministically fail clearing, so the compensation path is actually exercisable and
    # tested rather than theoretical. Not a business rule.
    simulated-bank-failure-threshold: 500000
  reconciliation:
    auto-resolve-threshold: 1.00
    schedule-cron: "0 0 2 * * *"

claude:
  api-key: ${CLAUDE_API_KEY:placeholder-set-me}
  api-url: https://api.anthropic.com
  model: claude-3-5-haiku-20241022
  timeout-ms: 2000

kafka:
  topics:
    orders: orders
    orders-validated: orders-validated
    trades: trades
    prices: prices
    risk-alerts: risk-alerts
    payments: payments
    payments-validated: payments-validated
    ledger-entries: ledger-entries
    settlements: settlements
    fraud-alerts: fraud-alerts
    notifications: notifications
    notifications-dlq: notifications-dlq
  fallback-queue:
    # Single-instance, in-memory safety net for a transient Kafka outage — see
    # KafkaEventPublisher's javadoc. Not a durable store.
    capacity: 10000
    drain-interval-ms: 5000

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
