spring:
  application:
    name: trading-platform

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/trading
    username: trading
    password: trading
    hikari:
      maximum-pool-size: 20
      pool-name: trading-hikari

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: batch
      # Wraps each listener invocation in a Micrometer Observation, so a trace started by the
      # producing HTTP request continues across the Kafka hop instead of starting a new one.
      observation-enabled: true
    template:
      observation-enabled: true

jwt:
  # Local HS256 secret for Phase 1. Production would source this from GCP Secret Manager
  # and likely front an OAuth2 IdP instead of a shared symmetric secret.
  secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes}
  issuer: trading-platform
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 7

app:
  security:
    # AuthController sets access_token/refresh_token as Secure cookies by default — requires
    # HTTPS, which is why the dev profile flips this to false for plain-http local curl testing.
    cookie-secure: true
    # Scopes WebSocketConfig's /v1/orders/stream handler to the real frontend origin(s) instead of
    # "*" — comma-separated for multi-origin deployments (e.g. staging + production hostnames).
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # "always" so the custom order-book-depth indicator is actually visible. A production
      # deployment behind a real IdP would tighten this to "when-authorized" with an ops role.
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Prometheus-compatible histogram buckets for the built-in HTTP timer, so Grafana can
        # run histogram_quantile() against it the same way it does for the custom business
        # timers (transfer.latency, fraud.detection.latency), which set this per-timer instead.
        http.server.requests: true
  tracing:
    sampling:
      # 100% sampling — this is a demo/dev-scale deployment, not a high-traffic production system
      # where tailing every trace would be expensive. A real production tuning would sample a
      # fraction and always-sample errors/slow requests instead.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /v1/swagger-ui.html
  api-docs:
    path: /v1/api-docs

chronicle:
  trade-journal:
    path: ${CHRONICLE_PATH:./chronicle-data/trades}
  kafka-fallback:
    path: ${CHRONICLE_KAFKA_FALLBACK_PATH:./chronicle-data/kafka-fallback}

trading:
  currency-pairs: EUR/USD,GBP/USD,USD/JPY,USD/CHF,AUD/USD
  stock-symbols: AAPL,MSFT,GOOGL,AMZN,NVDA,TSLA,META
  price-feed:
    tick-interval-ms: 2000
    anomaly-threshold-percent: 10
  matching-engine:
    batch-size: 1000
    poll-timeout-ms: 100
    thread-affinity:
      enabled: false
      core: 0
  risk:
    max-notional-per-client: 1000000
    max-orders-per-window: 5
    window-seconds: 60

payment:
  fraud:
    amount-multiplier-threshold: 3
    max-payments-per-window: 5
    window-seconds: 60
    country-change-window-hours: 2
  settlement:
    # Stand-in for a real bank gateway (none exists for Phase 2): amounts above this
    # deterministically fail clearing, so the compensation path is actually exercisable and
    # tested rather than theoretical. Not a business rule.
    simulated-bank-failure-threshold: 500000
  reconciliation:
    auto-resolve-threshold: 1.00
    schedule-cron: "0 0 2 * * *"

loan:
  interest:
    # Daily simple-interest accrual for all ACTIVE loans — see LoanServiceImpl.accrueInterest().
    accrual-cron: "0 0 3 * * *"

# Every AI call (fraud/anomaly severity, payment summaries, Game Mode debrief) goes through
# bate-mcp-server over real MCP now — see ai/mcp/McpToolClient.java. This app no longer holds
# an Anthropic API key itself; bate-mcp-server is the only thing that does.
mcp:
  server:
    url: ${MCP_SERVER_URL:http://localhost:8081/mcp}
  client:
    timeout-ms: 3000

kafka:
  topics:
    orders: orders
    orders-validated: orders-validated
    trades: trades
    prices: prices
    risk-alerts: risk-alerts
    payments: payments
    payments-validated: payments-validated
    ledger-entries: ledger-entries
    fraud-alerts: fraud-alerts
    notifications: notifications
    account-activity: account-activity
    transfers: transfers
    loans: loans
  fallback-queue:
    # Single-instance safety net for a transient Kafka outage, backed by a Chronicle Queue file
    # (chronicle.kafka-fallback.path) so a queued event survives an app restart — see
    # KafkaEventPublisher's javadoc.
    drain-interval-ms: 5000
    max-drain-per-cycle: 1000

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
